name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # 👈 هادي هي السر باش PyPI يتعرف على GitHub ديريكت
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Flit
      run: pip install flit

    - name: Publish with Flit to PyPI
      run: flit publish
